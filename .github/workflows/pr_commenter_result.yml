# yamllint disable rule:document-start
# yamllint disable rule:line-length
# Reports the result of the "CI - PR" checks on the pull request:
#   - every failure is a NEW comment saying what failed and how to fix it
#   - a success is a NEW comment too (repeated passes update the same one)
#   - the pull request's status comment is updated to the latest state
# New comments notify the author; edits do not.
#
# This workflow runs with write access on pull requests. It does not use any
# file produced by the pull request's own run: the pull request is found by
# asking GitHub which open pull request has the checked commit, and the
# reasons for a failure come from GitHub's record of which jobs failed.
name: PR Commenter

permissions:
  contents: read
  pull-requests: write
  actions: read

'on':
  workflow_run:
    workflows:
      - "CI - PR"
    types:
      - completed

jobs:
  report:
    name: Report CI result
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}

    steps:
      - name: Check out the helper script (default branch only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find the pull request for the checked commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          found="$(
            gh api "repos/${REPO}/pulls?state=open&per_page=100" --paginate |
              jq -r --arg sha "$HEAD_SHA" \
                '.[] | select(.head.sha == $sha) | "\(.number) \(.user.login)"' |
              head -n 1
          )"
          number="${found%% *}"
          author="${found#* }"
          if [[ -z "$found" || "$author" == 'dependabot[bot]' ]]; then
            echo "No open pull request to report on for ${HEAD_SHA}."
            exit 0
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "author=${author}" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: ${{ steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          commit="${HEAD_SHA:0:7}"
          bash .github/scripts/pr-status-comment.sh success <<COMMENT
          Hey @${AUTHOR},
          ✅  Your contribution passed all the checks, awesome! (commit \`${commit}\`)
          A maintainer will soon review your submission and provide additional feedback regarding your changes.
          Thanks again for dedicating your precious time to this project. 🔥
          COMMENT
          bash .github/scripts/pr-status-comment.sh status <<COMMENT
          Hey @${AUTHOR}, thank you so much for your contribution! 🚀

          **Latest result:** ✅ all checks passed for commit \`${commit}\` ([details](${RUN_URL})).
          COMMENT

      - name: Report failure
        if: ${{ steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          commit="${HEAD_SHA:0:7}"
          failed="$(
            gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" |
              jq -r '.jobs[] | select(.conclusion == "failure") | .name'
          )"
          reasons=''
          while IFS= read -r job; do
            case "$job" in
              '') ;;
              'Run Linters')
                reasons+='* **Code style:** your submission includes some code style issues. Open the "Run Linters" check, fix the reported errors and warnings, then push again.'$'\n'
                ;;
              'Run formatters to check code formatting')
                reasons+='* **Formatting:** your files are not properly formatted. Run `pnpm format` in the repository folder, commit the result and push again.'$'\n'
                ;;
              'Check website build')
                reasons+='* **Website build:** the website could not be built with your changes. Open the "Check website build" check to see the error, fix it and push again.'$'\n'
                ;;
              *)
                reasons+="* **${job}:** this check failed. Open it in the Pull Request checks to see why, fix it and push again."$'\n'
                ;;
            esac
          done <<<"$failed"
          bash .github/scripts/pr-status-comment.sh failure <<COMMENT
          Hey @${AUTHOR},
          ❌  It looks like there are some issues with your contribution (commit \`${commit}\`). Don't worry, here's what failed and how to solve it.

          ${reasons}
          You can see the full details [in the checks](${RUN_URL}).

          Once you push a fix the checks run again automatically. If you have any questions or doubts, you can always contact a project maintainer. :)
          Thanks!
          COMMENT
          bash .github/scripts/pr-status-comment.sh status <<COMMENT
          Hey @${AUTHOR}, thank you so much for your contribution! 🚀

          **Latest result:** ❌ some checks failed for commit \`${commit}\`. See the newest comment below for what failed and how to fix it ([details](${RUN_URL})).
          COMMENT
