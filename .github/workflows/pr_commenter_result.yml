# yamllint disable rule:document-start
# yamllint disable rule:line-length
# Reports the result of the "CI - PR" checks in the pull request's status
# comment (one comment per pull request, updated in place).
#
# This workflow runs with write access on pull requests. It does not use any
# file produced by the pull request's own run: the pull request is found by
# asking GitHub which open pull request has the checked commit, and the
# reasons for a failure come from GitHub's record of which jobs failed.
name: PR Commenter

permissions:
  contents: read
  pull-requests: write
  actions: read

'on':
  workflow_run:
    workflows:
      - "CI - PR"
    types:
      - completed

jobs:
  report:
    name: Report CI result
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}

    steps:
      - name: Check out the helper script (default branch only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find the pull request for the checked commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          found="$(
            gh api "repos/${REPO}/pulls?state=open&per_page=100" --paginate |
              jq -r --arg sha "$HEAD_SHA" \
                '.[] | select(.head.sha == $sha) | "\(.number) \(.user.login)"' |
              head -n 1
          )"
          number="${found%% *}"
          author="${found#* }"
          if [[ -z "$found" || "$author" == 'dependabot[bot]' ]]; then
            echo "No open pull request to report on for ${HEAD_SHA}."
            exit 0
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "author=${author}" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: ${{ steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          bash .github/scripts/pr-status-comment.sh <<COMMENT
          Hey @${AUTHOR},
          ✅  Your contribution passed all the checks, awesome!
          A maintainer will soon review your submission and provide additional feedback regarding your changes.
          Thanks again for dedicating your precious time to this project. 🔥
          COMMENT

      - name: Report failure
        if: ${{ steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          failed="$(
            gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" |
              jq -r '.jobs[] | select(.conclusion == "failure") | .name'
          )"
          reasons=''
          while IFS= read -r job; do
            case "$job" in
              '') ;;
              'Run Linters')
                reasons+='* Your submission includes some code style issues. We invite you to inspect the output of the Pull Request checks and fix reported errors and warnings.'$'\n'
                ;;
              'Run formatters to check code formatting')
                reasons+='* Your files are not properly formatted. Did you remember to run `pnpm format` before submitting your changes?'$'\n'
                ;;
              'Check website build')
                reasons+='* The website could not be built with your changes. Please check the build output in the Pull Request checks.'$'\n'
                ;;
              *)
                reasons+="* The check \"${job}\" failed. Please inspect its output in the Pull Request checks."$'\n'
                ;;
            esac
          done <<<"$failed"
          bash .github/scripts/pr-status-comment.sh <<COMMENT
          Hey @${AUTHOR},
          ❌  It looks like there are some issues with your contribution. Don't worry, here's some additional information and guidance on how to solve them.

          ${reasons}
          You can see the details [in the checks](${RUN_URL}).

          Please fix reported issues, then submit your updates here. If you have any questions or doubts, you can always contact a project maintainer. :)
          Thanks!
          COMMENT
