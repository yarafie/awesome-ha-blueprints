# yamllint disable rule:document-start
# yamllint disable rule:line-length
# Greets the author of a pull request and tells them checks are running.
# This is the pull request's ONE status comment, updated in place on every
# push. Results are posted as separate comments by pr_commenter_result.yml
# (see .github/scripts/pr-status-comment.sh).
#
# This workflow runs with write access on pull requests, including those from
# forks. It must never check out or run code from the pull request: the
# checkout below is the base branch (main), which is the default here.
name: PR Commenter

'on':
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  thank-you-message:
    name: Thank you message
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

    steps:
      - name: Check out the helper script (base branch only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post or update the status comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          first_time=''
          case "$ASSOCIATION" in
            FIRST_TIME_CONTRIBUTOR | FIRST_TIMER)
              first_time=' If this is your first PR here, your submission needs to be approved before checks can run, so the process might take a little longer.'
              ;;
          esac
          bash .github/scripts/pr-status-comment.sh status <<COMMENT
          Hey @${AUTHOR}, thank you so much for your contribution! 🚀

          🔄 We're currently running a few checks to make sure that everything is great with your contribution.${first_time}
          The result will be posted in a new comment below. If something needs fixing, that comment explains what failed and how to solve it.

          Results are coming soon, stay tuned!
          COMMENT
