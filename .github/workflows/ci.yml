name: CI - Push

permissions:
  contents: read

'on':
  push:
    branches:
      - main

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: yamllint
        name: Yamllint
        uses: reviewdog/action-yamllint@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          yamllint_flags: '.'
          fail_level: error
          filter_mode: nofilter
      - if: always()
        id: eslint
        name: ESLint
        uses: reviewdog/action-eslint@v1.37
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-check
          eslint_flags: --ext js,jsx .
          fail_level: error
          filter_mode: nofilter
          workdir: website

  prettier:
    name: Prettier - Enforce code style
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: prettier
        name: Prettier
        uses: creyD/prettier_action@v4.6
        with:
          dry: true
          prettier_options: --check .
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}

  gh-pages:
    name: Deploy to GH Pages
    permissions:
      contents: write
    needs:
      - lint
      - prettier
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Website - Build
        run: cd website && pnpm build
        env:
          # the site build needs more than Node's default 4 GB of memory
          NODE_OPTIONS: --max-old-space-size=8192
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LIBRARY_MAINTAINERS: ${{ secrets.LIBRARY_MAINTAINERS }}
          ALLOWED_MAINTAINERS: ${{ secrets.ALLOWED_MAINTAINERS }}
      - name: Create .nojekyll file
        run: touch website/build/.nojekyll
      - name: Deploy to GitHub Pages
        run: bash .github/scripts/deploy-gh-pages.sh
        env:
          FOLDER: website/build
          BRANCH: gh-pages
          COMMIT_NAME: ${{ github.event.pusher.name }}
          COMMIT_EMAIL: ${{ github.event.pusher.email }}
      - name: Commit the library report if the build changed it
        run: bash .github/scripts/commit-library-report.sh
