# Blueprint Metadata
blueprint:
  name: Controller - IKEA E2490 BILRESA remote control with scroll wheel
  description: |
    # Controller - IKEA E2490 BILRESA remote control with scroll wheel

    ℹ️ Version 2026.11.22

    Controller automation for executing any kind of action triggered by the provided IKEA E2490 BILRESA remote control with scroll wheel.
    The remote has a single wheel which can be pressed once, twice or three times, and rotated.
    Supports Zigbee2MQTT.

    Automations created with this blueprint can be connected with one or more [Hooks](https://yarafie.github.io/awesome-ha-blueprints/docs/blueprints/hooks) supported by this controller.
    Hooks allow to easily create controller-based automations for interacting with lights, covers, media players, and potentially more.
    See the list of [Hooks available for this controller](https://yarafie.github.io/awesome-ha-blueprints/docs/blueprints/controllers/ikea_e2490/EPMatt/awesome/2026.11.22#available-hooks) for additional details.

    ## More Info

    📝 [Changelog](https://yarafie.github.io/awesome-ha-blueprints/docs/blueprints/controllers/ikea_e2490/EPMatt/awesome/2026.11.22#changelog)
    📕 Full documentation regarding this blueprint is available [here](https://yarafie.github.io/awesome-ha-blueprints/docs/blueprints/controllers/ikea_e2490).

    🚀 This blueprint is part of the **[Awesome HA Blueprints](https://yarafie.github.io/awesome-ha-blueprints) project**. Please consider **[leaving a star on GitHub](https://github.com/yarafie/awesome-ha-blueprints)**! 🌟

  source_url: https://github.com/yarafie/awesome-ha-blueprints/blob/main/website/docs/blueprints/controllers/ikea_e2490/EPMatt/awesome/2026.11.22/ikea_e2490.yaml
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  # Device Selector
  input:
    controller_device:
      name: (Zigbee2MQTT Required) Controller Device
      description: The controller device to use for the automation.
      default: ''
      selector:
        device:
          filter:
            # source: https://www.zigbee2mqtt.io/devices/E2490.html
            - integration: mqtt
              manufacturer: IKEA
              model: BILRESA remote control with scroll wheel
            # newer Zigbee2MQTT versions add "(Matter)" to the model description
            - integration: mqtt
              manufacturer: IKEA
              model: BILRESA remote control with scroll wheel (Matter)
          multiple: false
    # inputs for custom actions
    action_button_short:
      name: (Optional) Wheel single press
      description: Action to run on a single press of the wheel. The remote alternates between sending on and off for single presses, both run this action.
      default: []
      selector:
        action:
    action_button_double:
      name: (Optional) Wheel double press
      description: Action to run on a double press of the wheel.
      default: []
      selector:
        action:
    action_button_triple:
      name: (Optional) Wheel triple press
      description: Action to run on a triple press of the wheel.
      default: []
      selector:
        action:
    action_rotate_wheel:
      name: (Optional) Rotate wheel
      description: Action to run when the wheel is rotated. The remote sends several events while the wheel is turning.
      default: []
      selector:
        action:
#
# Automation schema
variables:
  # Controller ID
  controller_id: !input controller_device
  # integration id used to select items in the action mapping
  # integration type is set from trigger.id
  integration_id: '{{ trigger.id.split("-")[0] }}'
  # convert input tags to variables, to be used in templates
  # mapping between actions and integrations
  actions_mapping:
    z2m:
      # source: https://www.zigbee2mqtt.io/devices/E2490.html
      # a single press alternates between on and off, a triple press is reported as off_double
      button_short: ['on', 'off']
      button_double: [on_double]
      button_triple: [off_double]
      rotate_wheel: [brightness_move_to_level]
  # pre-choose actions for buttons based on configured integration
  # mainly used to pass to hooks through ahb_controller_event
  button_short: '{{ actions_mapping[integration_id]["button_short"] }}'
  button_double: '{{ actions_mapping[integration_id]["button_double"] }}'
  button_triple: '{{ actions_mapping[integration_id]["button_triple"] }}'
  rotate_wheel: '{{ actions_mapping[integration_id]["rotate_wheel"] }}'
#
# Mode Block
mode: single
max_exceeded: silent
#
# Triggers Block
triggers:
  # triggers for zigbee2mqtt
  # Wheel single press, the remote alternates between on and off
  - trigger: device
    id: z2m-button-short-on
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: 'on'
  - trigger: device
    id: z2m-button-short-off
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: 'off'
  # Wheel double press
  - trigger: device
    id: z2m-button-double
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: on_double
  # Wheel triple press
  - trigger: device
    id: z2m-button-triple
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: off_double
  # Rotate Wheel
  - trigger: device
    id: z2m-rotate-wheel
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: brightness_move_to_level

#
# Conditions Block
conditions:
  - condition: and
    conditions:
      # check that the button event is not empty
      - >-
        {%- set trigger_action -%}
        {%- if integration_id == "z2m" -%}
        {{ trigger.payload }}
        {%- elif integration_id == "zha" -%}
        {{ trigger.event.data.command }}{{"_" if trigger.event.data.args|length > 0}}{{ trigger.event.data.args|join("_") }}
        {%- elif integration_id == "dcz" -%}
        {{ trigger.event.data.event }}
        {%- endif -%}
        {%- endset -%}
        {{ trigger_action not in ["","None","unknown"] }}
#
# Actions Block
actions:
  #
  # choose the sequence to run based on the received button event
  - choose:
      #
      # Actions for Wheel single press
      - conditions:
          - condition: trigger
            id:
              - z2m-button-short-on
              - z2m-button-short-off
        sequence:
          # fire the ahb hook event
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_short
          # run the custom action
          - choose:
              - conditions: []
                sequence: !input action_button_short
      #
      # Actions for Wheel double press
      - conditions:
          - condition: trigger
            id:
              - z2m-button-double
        sequence:
          # fire the ahb hook event
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_double
          # run the custom action
          - choose:
              - conditions: []
                sequence: !input action_button_double
      #
      # Actions for Wheel triple press
      - conditions:
          - condition: trigger
            id:
              - z2m-button-triple
        sequence:
          # fire the ahb hook event
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: button_triple
          # run the custom action
          - choose:
              - conditions: []
                sequence: !input action_button_triple
      #
      # Actions for Rotate wheel
      - conditions:
          - condition: trigger
            id:
              - z2m-rotate-wheel
        sequence:
          # fire the ahb hook event
          - event: ahb_controller_event
            event_data:
              controller: '{{ controller_id }}'
              action: rotate_wheel
          # run the custom action
          - choose:
              - conditions: []
                sequence: !input action_rotate_wheel
